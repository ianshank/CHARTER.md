[project]
name = "charter-core"
version = "0.1.0"
description = "Pure evaluation engine for the charter-kit governance standard."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9,<3",
    "ruamel.yaml>=0.18,<0.19",
]

[project.urls]
Homepage = "https://github.com/ianshank/CHARTER.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charter_core"]
