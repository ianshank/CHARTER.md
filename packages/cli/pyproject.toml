[project]
name = "charter-kit-cli"
version = "0.1.0"
description = "Command-line interface and git/filesystem adapters for charter-kit."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# charter-kit-core is declared as a real versioned dependency, not only as a
# workspace source: [tool.uv.sources] is stripped at build time, so without
# this the published wheel would be uninstallable.
dependencies = [
    "charter-kit-core==0.1.0",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "jsonschema>=4.23",
]

[project.scripts]
charter = "charter_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charter_cli"]

[tool.deptry]
# This project's own package, renamed off its import name (S2) -- without
# this, every internal `from charter_cli.x import y` reads as an undeclared
# transitive dependency instead of the project's own code.
known_first_party = ["charter_cli"]

[tool.deptry.package_module_name_map]
# charter-kit-core is a genuine external dependency here (declared above),
# renamed off its import name for the same PyPI-collision reason (S2).
"charter-kit-core" = "charter_core"

[tool.deptry.per_rule_ignores]
# Declared for the CLI commands S4 builds; nothing imports them yet because
# no command exists (only exit_codes.py and __init__.py are implemented).
# Narrow to these five names rather than blanket-ignoring DEP002, so a
# genuinely unused dependency added later still fails this check.
DEP002 = ["charter-kit-core", "typer", "rich", "structlog", "jsonschema"]
