name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs that need more must say so explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Derandomised property tests: a flaky governance gate is worse than a slow one.
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    name: Lint, types, and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: import contracts
        # Mechanically enforces that charter-core performs no I/O and never
        # imports its consumers. This is the purity guarantee, not a style rule.
        run: uv run lint-imports

  test:
    name: Tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # Windows is not optional: it is what proves the CRLF handling in the
          # generated-block protocol and the POSIX path handling in the ledger.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: branch coverage
        # The floor lives in [tool.coverage.report] fail_under, the one place
        # `make cov` and this job can never disagree about the number.
        run: make cov

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Regenerate and diff
        # The published schemas are the normative artifact. If this fails, the
        # models moved without the schema following: run `make schema`.
        run: |
          make schema
          git diff --exit-code -- schema/

  hygiene:
    name: Dependency and dead-code hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: deptry
        # Installed as a dev dependency since S1 but never actually run until
        # now -- per-package invocation, config lives in each package's own
        # pyproject.toml (workspace-root invocation false-positives on every
        # internal absolute import; see packages/*/pyproject.toml).
        run: make deptry
      - name: vulture
        run: make vulture

  security:
    name: Dependency vulnerabilities and secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the checked-out tree
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pip-audit
        run: make audit
      - name: gitleaks
        # Pinned by major-version tag, not SHA like the other actions in this
        # file: this session had no way to verify a specific commit SHA for a
        # third-party action outside its repository access scope, and a
        # fabricated SHA is worse than a floating major tag. Replace with a
        # verified SHA pin when convenient.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packaging:
    name: Wheels install without the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Build both distributions
        run: uv build --all-packages --out-dir dist/
      - name: Install into a clean venv with no workspace present
        # [tool.uv.sources] is stripped at build time, so this proves the
        # charter-kit-cli wheel declares charter-kit-core as a real versioned
        # dependency rather than a workspace path.
        #
        # Install by explicit wheel path, never by name. `charter-core` and
        # `charter-cli` are real, unrelated packages on PyPI, so resolving our
        # distributions by name would let a stranger's release satisfy this job
        # and still go green.
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          uv venv
          uv pip install --no-cache "$GITHUB_WORKSPACE"/dist/charter_kit_core-*.whl \
                                    "$GITHUB_WORKSPACE"/dist/charter_kit_cli-*.whl
          # Invoke the venv interpreter directly: `uv run` outside a project
          # would try to resolve one, which is the opposite of the isolation
          # this job exists to prove.
          .venv/bin/python -c 'import charter_cli, charter_core; from charter_core.schema_export import SCHEMAS; print("installed", charter_core.__version__, sorted(SCHEMAS))'
      - name: Wheel metadata names the renamed dependency
        run: |
          python3 -c "
          import glob, zipfile, sys
          whl = glob.glob('dist/charter_kit_cli-*.whl')[0]
          with zipfile.ZipFile(whl) as z:
              meta = next(z.read(n).decode() for n in z.namelist() if n.endswith('METADATA'))
          assert 'Requires-Dist: charter-kit-core' in meta, meta
          assert 'Requires-Dist: charter-core' not in meta.replace('charter-kit-core', '')
          print('Requires-Dist verified')
          "
          # The 'charter' console script is declared but not yet runnable: its
          # entry point is charter_cli.main:app, which S4 adds. Assert it once
          # that lands rather than pinning a gap the plan already accounts for.
